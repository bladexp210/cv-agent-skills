  - id: decision_wider_rule
    en: wider rule
    fr: règle élargie
    ar: قاعدة أوسع
    notes: Turn 5 machine token.

  - id: decision_resolve
    en: resolve
    fr: résoudre
    ar: حل
    notes: Turn 6 machine token (shared).

  - id: decision_accept
    en: accept
    fr: accepter
    ar: قبول
    notes: Turn 6 machine token (shared).

  - id: decision_resolve_flag
    en: resolve-flag
    fr: résoudre le signalement
