  - id: decision_add
    en: add
    fr: ajouter
    ar: إضافة
    notes: Turn 2 machine token.

  - id: decision_reject
    en: reject
    fr: rejeter
    ar: رفض
    notes: Turn 4 machine token.

  - id: decision_route_to_bank
    en: route-to-bank
    fr: renvoyer à la banque
