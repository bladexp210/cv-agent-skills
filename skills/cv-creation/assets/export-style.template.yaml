version: 1
page:
  size: A4
  margins: { top: 20mm, bottom: 20mm, left: 18mm, right: 18mm }
fonts:
  family: "Calibri, Arial, sans-serif"
  size_pt: 10.5
  heading_size_pt: 12
  name_size_pt: 16
  line_height: 1.3
layout:
  single_column: true
  tables: false
  text_boxes: false
  content_headers_footers: false
  real_list_styles: true
heading:
  case: title
  rule_after: true
bullets:
  glyph: "•"
  indent_mm: 4
  spacing_after_pt: 2
skills_section:
  format: inline_pipe
ats:
  enforce_safe_layout: true
  plain_text_export: true
colors:
  text: "#000000"
  accent: "#000000"
